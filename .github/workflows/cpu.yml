name: CPU integrity and tiny-model smoke
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.1 numpy==2.2.5 scikit-learn==1.7.1 Pillow==11.3.0 matplotlib==3.10.7
      - run: python -m scripts.audit_dataset
      - run: python -m unittest discover -s tests -v
